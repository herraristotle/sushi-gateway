# Sushi Gateway - Clean Kong-Style Configuration
# Demonstrates: paths array, url field, optional methods, inline syntax

global:
  name: sushi-gateway-clean

services:
  # Simple service with multiple paths
  - name: sushi-api
    url: http://sushi-svc:3000
    routes:
      - name: menu-endpoints
        paths: [/v1/sushi, /v1/menu]    # Multiple paths per route
        # methods: omitted = all methods allowed
        
      - name: restaurants
        paths: [/v1/restaurants]
        methods: [GET]                  # Inline syntax
        plugins:
          - name: cache
            enabled: true
            config:
              ttl: 60

  # Service with load balancing (traditional style still supported)
  - name: user-api
    base_path: /users
    protocol: http
    load_balancing_strategy: round_robin
    upstreams:
      - host: user-svc-1
        port: 3000
        weight: 70
      - host: user-svc-2
        port: 3000
        weight: 30
    routes:
      - name: user-crud
        paths: [/v1/users, /v1/users/{id}]   # Dynamic + static paths
        methods: [GET, POST, PUT, DELETE]

  # BFF Service with response aggregation
  - name: dashboard
    url: http://bff-internal:8080
    routes:
      - name: user-dashboard
        paths: [/v1/dashboard/user/{id}]
        backends:
          - name: profile
            url: http://user-svc:3000/users/{id}
            required: true
          - name: orders
            url: http://order-svc:3000/orders/user/{id}
            required: false
          - name: notifications
            url: http://notify-svc:3000/notifications/{id}
            required: false
        plugins:
          - name: cache
            enabled: true
            config:
              ttl: 30
